<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Trophy Gold/Emerald Gradient -->
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="16"/>

  <!-- Trophy Emblem -->
  <g transform="translate(106, 75) scale(1.18)">
    <!-- Cup Handles -->
    <path d="M 50 65 C 0 65 0 155 50 165" stroke="url(#trophyGrad)" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 206 65 C 256 65 256 155 206 165" stroke="url(#trophyGrad)" stroke-width="18" stroke-linecap="round" fill="none"/>

    <!-- Main Cup Bowl -->
    <path d="M 40 35 L 216 35 L 196 140 C 180 190 148 210 128 210 C 108 210 76 190 60 140 Z" fill="url(#trophyGrad)"/>
    
    <!-- Stem & Base -->
    <path d="M 112 210 L 144 210 L 148 250 L 108 250 Z" fill="url(#trophyGrad)"/>
    <path d="M 65 250 L 191 250 L 201 280 L 55 280 Z" fill="url(#trophyGrad)"/>

    <!-- Crown Star Accent -->
    <polygon points="128,12 137,32 158,32 141,45 147,65 128,52 109,65 115,45 98,32 119,32" fill="#F59E0B"/>
  </g>
</svg>
